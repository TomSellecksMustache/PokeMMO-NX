name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.1.4-nxpanded.1)"
        required: true

permissions:
  contents: write

env:
  BASE_TAG: base-files                      # release that holds the base zip (see steps below)
  BASE_ASSET: PokeMMO-NXpanded-base.zip     # the zip with isolate-root, forwarder.nsp, chains/, etc.
  FOLDER: PokeMMO-NXpanded                  # top-level folder inside the final zip

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        working-directory: native
        run: make -j2

      - name: Collect PokeMMO.nro
        run: |
          mkdir -p dist
          nro=$(find . -name "PokeMMO.nro" -not -path "./dist/*" | head -n 1)
          if [ -z "$nro" ]; then
            echo "::error::PokeMMO.nro was not produced by the build"
            exit 1
          fi
          cp -v "$nro" dist/PokeMMO.nro

      - name: Upload .nro for packaging
        uses: actions/upload-artifact@v4
        with:
          name: nro
          path: dist/PokeMMO.nro
          if-no-files-found: error

  package-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built .nro
        uses: actions/download-artifact@v4
        with:
          name: nro
          path: built

      - name: Download base game files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$BASE_ASSET" \
            --dir base
          unzip -q "base/$BASE_ASSET" -d stage
          test -d "stage/$FOLDER/isolate-root" || {
            echo "::error::$BASE_ASSET must contain $FOLDER/isolate-root"
            exit 1
          }

      - name: Assemble release folder
        run: |
          cp -v built/PokeMMO.nro "stage/$FOLDER/PokeMMO.nro"
          # keep license files current with the repo
          [ -f LICENSE ] && cp -v LICENSE "stage/$FOLDER/LICENSE"
          [ -f THIRD-PARTY-NOTICES.md ] && cp -v THIRD-PARTY-NOTICES.md "stage/$FOLDER/THIRD-PARTY-NOTICES.md"
          [ -f README.md ] && cp -v README.md "stage/$FOLDER/README.md"
          mkdir -p "stage/$FOLDER/chains"
          find "stage/$FOLDER" -maxdepth 2 | sort

      - name: Zip
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          cd stage
          zip -r -q "../${FOLDER}-${TAG}.zip" "$FOLDER"
          cd ..
          ls -lh "${FOLDER}-${TAG}.zip"
          echo "ZIP_PATH=${FOLDER}-${TAG}.zip" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: ${{ env.ZIP_PATH }}
          generate_release_notes: true
