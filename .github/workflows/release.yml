name: Release

on:
  push:
    tags:
      - "v*"          # e.g. v1.1.4-nxpanded.1
  workflow_dispatch:

permissions:
  contents: write     # required to create a release and upload files

jobs:
  build-release:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # remove if you don't use submodules

      - name: Build
        working-directory: native
        run: make -j2

      - name: Package
        run: |
          mkdir -p dist
          cp native/*.nro dist/        # adjust to wherever your build outputs land
          cd dist && ls -l

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
